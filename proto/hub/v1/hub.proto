syntax = "proto3";

package hub.v1;

option go_package = "github.com/kapture-io/kapture/proto/hub/v1;hubv1";

import "google/protobuf/timestamp.proto";

// HubService defines the gRPC API between the hub and agent controllers.
service HubService {
  // Agent lifecycle
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc DeregisterAgent(DeregisterAgentRequest) returns (DeregisterAgentResponse);

  // Capture orchestration (hub → agent directives via server-streaming)
  rpc WatchDirectives(WatchDirectivesRequest) returns (stream WatchDirectivesResponse);

  // Status reporting (agent → hub)
  rpc ReportCaptureStatus(ReportCaptureStatusRequest) returns (ReportCaptureStatusResponse);

  // Query API (for dashboards / CLI tooling)
  rpc ListCaptures(ListCapturesRequest) returns (ListCapturesResponse);
  rpc GetCaptureStatus(GetCaptureStatusRequest) returns (GetCaptureStatusResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
}

// ─── Agent lifecycle ────────────────────────────────────────────────────────

message RegisterAgentRequest {
  string agent_id = 1;
  string cluster_name = 2;
  string kubernetes_version = 3;
  // Capabilities advertised by the agent (e.g. supported storage backends).
  repeated string capabilities = 4;
}

message RegisterAgentResponse {
  bool accepted = 1;
  string message = 2;
  // Interval (seconds) at which the agent should send heartbeats.
  int32 heartbeat_interval_seconds = 3;
}

message HeartbeatRequest {
  string agent_id = 1;
  int32 active_captures = 2;
  repeated CaptureStatusSummary capture_summaries = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message DeregisterAgentRequest {
  string agent_id = 1;
  string reason = 2;
}

message DeregisterAgentResponse {
  bool acknowledged = 1;
}

// ─── Capture orchestration ──────────────────────────────────────────────────

message WatchDirectivesRequest {
  string agent_id = 1;
}

// CaptureDirective is a hub-initiated instruction sent to an agent.
enum DirectiveAction {
  DIRECTIVE_ACTION_UNSPECIFIED = 0;
  DIRECTIVE_ACTION_START = 1;
  DIRECTIVE_ACTION_STOP = 2;
  DIRECTIVE_ACTION_UPDATE = 3;
}

// WatchDirectivesResponse wraps a CaptureDirective for the streaming RPC.
message WatchDirectivesResponse {
  CaptureDirective directive = 1;
}

message CaptureDirective {
  string directive_id = 1;
  DirectiveAction action = 2;
  string capture_name = 3;
  string capture_namespace = 4;
  // Serialised TrafficCapture spec for START / UPDATE directives.
  CaptureSpec spec = 5;
}

message CaptureSpec {
  string target_route_group = 1;
  string target_route_kind = 2;
  string target_route_name = 3;
  string storage_ref_name = 4;
  CaptureSettings capture_settings = 5;
  CaptureFilters filters = 6;
  AgentScaling agent_scaling = 7;
}

message CaptureSettings {
  bool include_headers = 1;
  bool include_body = 2;
  int64 max_body_bytes = 3;
  string duration = 4;
}

message CaptureFilters {
  repeated HeaderMatch headers = 1;
  string path_prefix = 2;
  int32 percentage = 3;
}

message HeaderMatch {
  string name = 1;
  string value = 2;
}

message AgentScaling {
  int32 replicas = 1;
  int32 min_replicas = 2;
  int32 max_replicas = 3;
  int32 target_cpu = 4;
}

// ─── Status reporting ───────────────────────────────────────────────────────

message CaptureStatusSummary {
  string capture_name = 1;
  string capture_namespace = 2;
  CapturePhase phase = 3;
  int64 captured_requests = 4;
  int64 bytes_written = 5;
  int32 ready_replicas = 6;
  int32 desired_replicas = 7;
}

enum CapturePhase {
  CAPTURE_PHASE_UNSPECIFIED = 0;
  CAPTURE_PHASE_PENDING = 1;
  CAPTURE_PHASE_ACTIVE = 2;
  CAPTURE_PHASE_COMPLETED = 3;
  CAPTURE_PHASE_FAILED = 4;
}

message ReportCaptureStatusRequest {
  string agent_id = 1;
  repeated CaptureStatusSummary statuses = 2;
}

message ReportCaptureStatusResponse {
  bool acknowledged = 1;
}

// ─── Query API ──────────────────────────────────────────────────────────────

message ListCapturesRequest {
  // Optional: filter by agent.
  string agent_id = 1;
  // Optional: filter by namespace.
  string namespace = 2;
}

message CaptureInfo {
  string capture_name = 1;
  string capture_namespace = 2;
  string agent_id = 3;
  CapturePhase phase = 4;
  int64 captured_requests = 5;
  int64 bytes_written = 6;
  google.protobuf.Timestamp start_time = 7;
  int32 ready_replicas = 8;
  int32 desired_replicas = 9;
}

message ListCapturesResponse {
  repeated CaptureInfo captures = 1;
}

message GetCaptureStatusRequest {
  string capture_name = 1;
  string capture_namespace = 2;
  // If empty, returns aggregate across all agents.
  string agent_id = 3;
}

message GetCaptureStatusResponse {
  CaptureInfo capture = 1;
}

message ListAgentsRequest {}

message AgentInfo {
  string agent_id = 1;
  string cluster_name = 2;
  int32 active_captures = 3;
  google.protobuf.Timestamp last_heartbeat = 4;
  repeated string capabilities = 5;
  AgentState state = 6;
}

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_CONNECTED = 1;
  AGENT_STATE_DISCONNECTED = 2;
}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}
