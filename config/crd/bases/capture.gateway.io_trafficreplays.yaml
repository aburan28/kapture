kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: trafficreplays.capture.gateway.io
spec:
  group: capture.gateway.io
  names:
    kind: TrafficReplay
    listKind: TrafficReplayList
    plural: trafficreplays
    singular: trafficreplay
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .spec.target.host
      name: Target
      type: string
    - jsonPath: .status.sentRequests
      name: Sent
      type: integer
    - jsonPath: .status.failedRequests
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TrafficReplay defines a traffic replay request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TrafficReplaySpec defines the desired state of TrafficReplay.
            properties:
              concurrency:
                default: 1
                description: Concurrency is the number of parallel replay workers.
                  Defaults to 1.
                format: int32
                minimum: 1
                type: integer
              filters:
                description: Filters narrows which captured requests are replayed.
                properties:
                  endTime:
                    description: EndTime replays only requests captured before this
                      time.
                    format: date-time
                    type: string
                  limit:
                    description: Limit caps the total number of requests to replay.
                      Zero means unlimited.
                    format: int64
                    minimum: 0
                    type: integer
                  methods:
                    description: Methods filters to specific HTTP methods.
                    items:
                      type: string
                    type: array
                  pathPrefix:
                    description: PathPrefix filters to requests whose path starts
                      with this prefix.
                    type: string
                  startTime:
                    description: StartTime replays only requests captured at or after
                      this time.
                    format: date-time
                    type: string
                type: object
              loadTestRef:
                description: |-
                  LoadTestRef links this replay to the CaptureLoadTest that spawned it.
                  Set by the spoke controller when the replay was created from a hub
                  directive; user-created replays leave it unset.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              rate:
                description: Rate controls replay pacing. Optional, defaults to unlimited.
                properties:
                  mode:
                    default: Unlimited
                    description: Mode controls how replay requests are paced.
                    enum:
                    - Constant
                    - OriginalTiming
                    - Unlimited
                    type: string
                  requestsPerSecond:
                    description: RequestsPerSecond is the target RPS when Mode is
                      Constant.
                    format: int32
                    minimum: 1
                    type: integer
                  timeScale:
                    description: |-
                      TimeScale multiplies original inter-request delays when Mode is
                      OriginalTiming. 1.0 = real-time, 0.5 = 2x speed.
                    type: string
                required:
                - mode
                type: object
              shard:
                description: |-
                  Shard restricts this replay to a deterministic slice of the capture.
                  Unset means the whole capture is replayed by this resource.
                properties:
                  count:
                    description: Count is the total number of shards the capture is
                      split into.
                    format: int32
                    minimum: 1
                    type: integer
                  index:
                    description: Index of this shard, in [0, count).
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - count
                - index
                type: object
              sourceRef:
                description: SourceRef references the TrafficCapture whose data should
                  be replayed.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              storageRef:
                description: StorageRef references the CaptureStorage to read captured
                  data from.
                properties:
                  name:
                    description: |-
                      ObjectName refers to the name of a Kubernetes object.
                      Object names can have a variety of forms, including RFC 1123 subdomains,
                      RFC 1123 labels, or RFC 1035 labels.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              target:
                description: Target defines where to send replayed traffic.
                properties:
                  host:
                    description: Host is the target hostname or IP to replay traffic
                      to.
                    type: string
                  port:
                    description: Port is the target port. Defaults to 80 for HTTP,
                      443 for HTTPS.
                    format: int32
                    type: integer
                  tls:
                    default: false
                    type: boolean
                required:
                - host
                type: object
              transforms:
                description: Transforms are applied in order to each request before
                  replay.
                items:
                  description: ReplayTransformRef references a named transformer plugin.
                  properties:
                    config:
                      description: Config is plugin-specific configuration.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: Name is the registered transformer plugin name
                        (e.g., "header-rewriter").
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
            - sourceRef
            - storageRef
            - target
            type: object
          status:
            description: TrafficReplayStatus defines the observed state of TrafficReplay.
            properties:
              achievedRPS:
                description: AchievedRPS is the observed send rate over the run.
                type: string
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failedRequests:
                description: FailedRequests is the number of requests that failed
                  to send.
                format: int64
                type: integer
              filteredRequests:
                description: FilteredRequests is the number of requests dropped by
                  filters or transforms.
                format: int64
                type: integer
              meanLatency:
                description: MeanLatency is the average round-trip time for replayed
                  requests.
                type: string
              p50Latency:
                description: P50Latency is the median round-trip time for replayed
                  requests.
                type: string
              p95Latency:
                description: P95Latency is the 95th percentile round-trip time.
                type: string
              p99Latency:
                description: P99Latency is the 99th percentile round-trip time.
                type: string
              phase:
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              sentRequests:
                description: SentRequests is the number of requests successfully sent
                  to the target.
                format: int64
                type: integer
              startTime:
                format: date-time
                type: string
              totalRequests:
                description: TotalRequests is the number of requests read from the
                  source.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
