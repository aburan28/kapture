---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: trafficreplays.capture.gateway.io
spec:
  group: capture.gateway.io
  names:
    kind: TrafficReplay
    listKind: TrafficReplayList
    plural: trafficreplays
    singular: trafficreplay
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.sourceRef.name
          name: Source
          type: string
        - jsonPath: .spec.target.host
          name: Target
          type: string
        - jsonPath: .status.sentRequests
          name: Sent
          type: integer
        - jsonPath: .status.failedRequests
          name: Failed
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: TrafficReplay defines a traffic replay request.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: TrafficReplaySpec defines the desired state of TrafficReplay.
              properties:
                concurrency:
                  default: 1
                  format: int32
                  minimum: 1
                  type: integer
                filters:
                  description: ReplayFilters narrows which captured requests are replayed.
                  properties:
                    endTime:
                      format: date-time
                      type: string
                    limit:
                      format: int64
                      minimum: 0
                      type: integer
                    methods:
                      items:
                        type: string
                      type: array
                    pathPrefix:
                      type: string
                    startTime:
                      format: date-time
                      type: string
                  type: object
                rate:
                  description: ReplayRateConfig controls the pacing of replayed requests.
                  properties:
                    mode:
                      default: Unlimited
                      enum:
                        - Constant
                        - OriginalTiming
                        - Unlimited
                      type: string
                    requestsPerSecond:
                      format: int32
                      minimum: 1
                      type: integer
                    timeScale:
                      type: string
                  required:
                    - mode
                  type: object
                sourceRef:
                  description: TrafficCaptureReference references a TrafficCapture.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                storageRef:
                  description: CaptureStorageReference references a CaptureStorage.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                target:
                  description: ReplayTarget defines the destination for replayed traffic.
                  properties:
                    host:
                      type: string
                    port:
                      format: int32
                      type: integer
                    tls:
                      default: false
                      type: boolean
                  required:
                    - host
                  type: object
                transforms:
                  items:
                    description: ReplayTransformRef references a named transformer plugin.
                    properties:
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      name:
                        type: string
                    required:
                      - name
                    type: object
                  type: array
              required:
                - sourceRef
                - storageRef
                - target
              type: object
            status:
              description: TrafficReplayStatus defines the observed state of TrafficReplay.
              properties:
                completionTime:
                  format: date-time
                  type: string
                conditions:
                  items:
                    description: Condition contains details for one aspect of the current
                      state.
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                failedRequests:
                  format: int64
                  type: integer
                filteredRequests:
                  format: int64
                  type: integer
                meanLatency:
                  type: string
                phase:
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                  type: string
                sentRequests:
                  format: int64
                  type: integer
                startTime:
                  format: date-time
                  type: string
                totalRequests:
                  format: int64
                  type: integer
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
