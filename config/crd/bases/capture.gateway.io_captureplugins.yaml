  name: captureplugins.capture.gateway.io
spec:
  group: capture.gateway.io
  names:
    kind: CapturePlugin
    listKind: CapturePluginList
    plural: captureplugins
    singular: captureplugin
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.container.image
      name: Image
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
