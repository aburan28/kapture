                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  type: boolean
                              required:
                              - key
                              type: object
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  resources:
                    description: ResourceRequirements describes the compute resources.
                    properties:
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?[0-9]+))?$
                          x-kubernetes-int-or-string: true
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?[0-9]+))?$
                          x-kubernetes-int-or-string: true
                        type: object
                    type: object
                  securityContext:
                    description: SecurityContext for the plugin container.
                    properties:
                      privileged:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      readOnlyRootFilesystem:
                        type: boolean
                      capabilities:
                        description: Add or drop POSIX capabilities.
                        properties:
                          add:
                            items:
                              type: string
                            type: array
                          drop:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                required:
                - image
                type: object
              ports:
                description: Ports the plugin container exposes (required for Mirror mode).
                items:
                  properties:
                    name:
                      type: string
                    containerPort:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: TCP
                      type: string
                  required:
                  - name
                  - containerPort
                  type: object
                type: array
              output:
                description: Output defines how the plugin emits captured data.
                properties:
                  type:
