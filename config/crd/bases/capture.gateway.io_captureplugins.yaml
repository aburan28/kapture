                          x-kubernetes-int-or-string: true
                      type: object
                    hostPath:
                      properties:
                        path:
                          type: string
                        type:
                          type: string
                      required:
                      - path
                      type: object
                    configMap:
                      properties:
                        name:
                          type: string
                        items:
                          items:
                            properties:
                              key:
                                type: string
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        optional:
                          type: boolean
                      type: object
                    secret:
                      properties:
                        secretName:
                          type: string
                        items:
                          items:
                            properties:
                              key:
                                type: string
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        optional:
                          type: boolean
                      type: object
                    sizeLimit:
                      anyOf:
                      - type: integer
                      - type: string
