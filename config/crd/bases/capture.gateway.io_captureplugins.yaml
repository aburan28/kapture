            type: object
          spec:
            description: CapturePluginSpec defines the desired state of CapturePlugin.
            properties:
              mode:
                description: Mode controls how the plugin captures traffic.
                enum:
                - Mirror
                - Standalone
                type: string
              container:
                description: Container defines the user-provided capture container.
                properties:
                  image:
                    type: string
                  command:
                    items:
                      type: string
                    type: array
                  args:
                    items:
                      type: string
                    type: array
                  env:
                    items:
                      description: EnvVar represents an environment variable.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                        valueFrom:
                          description: EnvVarSource represents a source for the value of an EnvVar.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  type: boolean
                              required:
                              - key
                              type: object
                            fieldRef:
                              description: Selects a field of the pod.
                              properties:
                                apiVersion:
                                  type: string
                                fieldPath:
                                  type: string
                              required:
                              - fieldPath
                              type: object
                            secretKeyRef:
                              description: Selects a key of a secret.
