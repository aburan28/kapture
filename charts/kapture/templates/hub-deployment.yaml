{{- if .Values.hub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kapture.fullname" . }}-hub
  namespace: {{ include "kapture.namespace" . }}
  labels:
    {{- include "kapture.hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels:
      {{- include "kapture.hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kapture.hub.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kapture.hub.serviceAccountName" . }}
      containers:
        - name: hub
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          {{- if or (gt (int .Values.hub.replicas) 1) .Values.hub.leaderElection }}
          args:
            - --enable-leader-election
          {{- end }}
          ports:
            - name: grpc
              containerPort: 9443
              protocol: TCP
          env:
            # Default namespace for CaptureHub spec.tls.certSecretRef
            # lookups when the reference has no explicit namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

