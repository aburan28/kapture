{{- if .Values.hub.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kapture.fullname" . }}-hub
  labels:
    {{- include "kapture.hub.labels" . | nindent 4 }}
rules:
  - apiGroups: ["capture.gateway.io"]
    resources: ["capturehubs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["capture.gateway.io"]
    resources: ["capturehubs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["capture.gateway.io"]
    resources: ["trafficcaptures"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["capture.gateway.io"]
    resources: ["trafficcaptures/status"]
    verbs: ["get"]
  - apiGroups: ["capture.gateway.io"]
    resources: ["captureloadtests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["capture.gateway.io"]
    resources: ["captureloadtests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["capture.gateway.io"]
    resources: ["captureloadtests/finalizers"]
    verbs: ["update"]
  # TLS certificate secrets referenced by CaptureHub spec.tls.certSecretRef.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election when running more than one hub replica.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kapture.fullname" . }}-hub
  labels:
    {{- include "kapture.hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kapture.fullname" . }}-hub
subjects:
  - kind: ServiceAccount
    name: {{ include "kapture.hub.serviceAccountName" . }}
    namespace: {{ include "kapture.namespace" . }}
{{- end }}

