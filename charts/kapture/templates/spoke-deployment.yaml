{{- if .Values.spoke.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kapture.fullname" . }}-spoke
  namespace: {{ include "kapture.namespace" . }}
  labels:
    {{- include "kapture.spoke.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.spoke.replicas }}
  selector:
    matchLabels:
      {{- include "kapture.spoke.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kapture.spoke.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kapture.spoke.serviceAccountName" . }}
      containers:
        - name: spoke
          image: "{{ .Values.spoke.image.repository }}:{{ .Values.spoke.image.tag }}"
          imagePullPolicy: {{ .Values.spoke.image.pullPolicy }}
          env:
            - name: AGENT_IMAGE
              value: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
            - name: REPLAY_ENGINE_IMAGE
              value: "{{ .Values.replayEngine.image.repository }}:{{ .Values.replayEngine.image.tag }}"
            {{- if .Values.replayEngine.pluginDir }}
            - name: REPLAY_PLUGIN_DIR
              value: {{ .Values.replayEngine.pluginDir | quote }}
            {{- end }}
            {{- if .Values.spoke.hub.address }}
            - name: HUB_ADDRESS
              value: {{ .Values.spoke.hub.address | quote }}
            {{- end }}
            {{- if .Values.spoke.cell }}
            - name: CELL_NAME
              value: {{ .Values.spoke.cell | quote }}
            {{- end }}
            {{- if .Values.history.enabled }}
            {{- if .Values.history.localPostgres.enabled }}
            - name: DATABASE_URL
              value: {{ include "kapture.history.localPostgres.databaseURL" . | quote }}
            {{- else if .Values.history.databaseURL.secretName }}
            - name: DATABASE_URL_SECRET_NAME
              value: {{ .Values.history.databaseURL.secretName | quote }}
            - name: DATABASE_URL_SECRET_KEY
              value: {{ .Values.history.databaseURL.secretKey | quote }}
            {{- else if .Values.history.databaseURL.value }}
            - name: DATABASE_URL
              value: {{ .Values.history.databaseURL.value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.spoke.resources | nindent 12 }}
      {{- with .Values.spoke.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spoke.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

