{{- if and .Values.spoke.enabled .Values.spoke.serviceAccount.create }}
{{- $annotations := dict -}}
{{- with .Values.spoke.serviceAccount.annotations }}
{{- $annotations = merge $annotations . -}}
{{- end }}
{{- if and .Values.spoke.irsa.enabled .Values.spoke.irsa.roleArn }}
{{- $annotations = merge $annotations (dict "eks.amazonaws.com/role-arn" .Values.spoke.irsa.roleArn) -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kapture.spoke.serviceAccountName" . }}
  namespace: {{ include "kapture.namespace" . }}
  labels:
    {{- include "kapture.spoke.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
