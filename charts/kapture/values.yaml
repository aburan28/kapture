# Default values for kapture.

# -- Install CRDs with the chart
installCRDs: true

history:
  # -- Enable PostgreSQL/RDS-backed capture history metadata.
  enabled: false
  databaseURL:
    # -- Direct PostgreSQL connection URL for development installs.
    value: ""
    # -- Existing Secret containing the PostgreSQL connection URL.
    secretName: ""
    # -- Key inside secretName containing the PostgreSQL connection URL.
    secretKey: "DATABASE_URL"
  localPostgres:
    # -- Deploy an in-cluster PostgreSQL database for local development.
    enabled: false
    image:
      repository: postgres
      tag: "18-alpine"
      pullPolicy: IfNotPresent
    auth:
      database: kapture
      username: kapture
      password: kapture
    service:
      port: 5432
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

hub:
  # -- Enable the hub controller
  enabled: true
  image:
    repository: kapture/hub
    tag: "dev"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  serviceAccount:
    # -- Create a ServiceAccount for the hub
    create: true
    # -- Annotations for the hub ServiceAccount
    annotations: {}
  irsa:
    # -- Enable AWS IRSA annotation injection for the hub ServiceAccount
    enabled: false
    # -- AWS IAM role ARN used by the hub workload (eks.amazonaws.com/role-arn)
    roleArn: ""
  service:
    type: ClusterIP
    port: 9443
  tls:
    # -- Name of the TLS secret for the hub gRPC server
    secretName: ""
    # -- Namespace of the TLS secret
    secretNamespace: ""
  # -- Node selector for hub pods
  nodeSelector: {}
  # -- Tolerations for hub pods
  tolerations: []

spoke:
  # -- Enable the spoke controller
  enabled: true
  image:
    repository: kapture/spoke
    tag: "dev"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  serviceAccount:
    # -- Create a ServiceAccount for the spoke
    create: true
    # -- Annotations for the spoke ServiceAccount
    annotations: {}
  irsa:
    # -- Enable AWS IRSA annotation injection for the spoke ServiceAccount
    enabled: false
    # -- AWS IAM role ARN used by the spoke workload (eks.amazonaws.com/role-arn)
    roleArn: ""
  hub:
    # -- gRPC address of the hub (e.g. hub-service.capture-system.svc:9443)
    address: ""
    tls:
      # -- Secret holding the spoke's hub-connection TLS material
      # (tls.crt/tls.key client certificate for mTLS, ca.crt for the hub
      # server CA). Empty disables TLS on the hub connection. The hub side
      # is configured on the CaptureHub CR (spec.tls + spec.authentication).
      secretName: ""
      # -- Expected hub server certificate name when it differs from the
      # dial host.
      serverName: ""
  # -- Deployment cell this spoke registers under. Cells let the hub target
  # captures and load tests at a subset of the fleet. Empty means no cell.
  cell: ""
  # -- Node selector for spoke pods
  nodeSelector: {}
  # -- Tolerations for spoke pods
  tolerations: []

agent:
  image:
    repository: kapture/agent
    tag: "dev"
    pullPolicy: IfNotPresent

replayEngine:
  image:
    repository: kapture/replay-engine
    tag: "dev"
    pullPolicy: IfNotPresent
  # -- Directory inside replay worker pods that holds engine plugin
  # binaries (kapture-engine-<name>) for non-builtin engines such as k6
  # and ghz. The default replay-engine image bakes the OOTB plugins at
  # /plugins. Empty disables plugin discovery configuration (builtin
  # engine only).
  pluginDir: ""
  # -- Optional image whose /plugin-installer entrypoint delivers engine
  # plugins into replay worker pods via an initContainer + shared
  # emptyDir mounted at pluginDir. Lets plugin updates ship without
  # rebuilding the replay-engine image (the replay-engine image itself
  # satisfies the installer contract).
  pluginImage: ""

# -- Namespace to deploy into (defaults to Release.Namespace)
namespace: ""
