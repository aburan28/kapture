suite: spoke tests
templates:
  - spoke-deployment.yaml
  - spoke-serviceaccount.yaml
  - spoke-rbac.yaml
tests:
  # --- Deployment ---
  - it: should render spoke deployment with defaults
    template: spoke-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kapture-spoke
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kapture-spoke
      - equal:
          path: spec.template.spec.containers[0].name
          value: spoke
      - equal:
          path: spec.template.spec.containers[0].image
          value: "kapture/spoke:dev"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: AGENT_IMAGE
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "kapture/agent:dev"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should not render spoke deployment when spoke.enabled is false
    template: spoke-deployment.yaml
    set:
      spoke.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render spoke deployment with hub address
    template: spoke-deployment.yaml
    set:
      spoke.hub.address: "hub-service.capture-system.svc:9443"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: HUB_ADDRESS
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "hub-service.capture-system.svc:9443"

  - it: should render spoke deployment with nodeSelector and tolerations
    template: spoke-deployment.yaml
    set:
      spoke.nodeSelector:
        disktype: ssd
      spoke.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "spoke"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
      - equal:
          path: spec.template.spec.tolerations[0].operator
          value: Equal
      - equal:
          path: spec.template.spec.tolerations[0].value
          value: spoke
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: NoSchedule

  # --- ServiceAccount ---
  - it: should render spoke serviceaccount with defaults
    template: spoke-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kapture-spoke
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: should not render spoke serviceaccount when spoke.serviceAccount.create is false
    template: spoke-serviceaccount.yaml
    set:
      spoke.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  # --- RBAC ---
  - it: should render spoke ClusterRole and ClusterRoleBinding with all required rules
    template: spoke-rbac.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kapture-spoke
        documentIndex: 0
      - equal:
          path: rules[0].apiGroups[0]
          value: capture.gateway.io
        documentIndex: 0
      - equal:
          path: rules[0].resources[0]
          value: trafficcaptures
        documentIndex: 0
      - equal:
          path: rules[4].apiGroups[0]
          value: gateway.networking.k8s.io
        documentIndex: 0
      - equal:
          path: rules[5].apiGroups[0]
          value: apps
        documentIndex: 0
      - equal:
          path: rules[5].resources[0]
          value: deployments
        documentIndex: 0
      - equal:
          path: rules[7].apiGroups[0]
          value: autoscaling
        documentIndex: 0
      - equal:
          path: rules[7].resources[0]
          value: horizontalpodautoscalers
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kapture-spoke
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: ClusterRole
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-kapture-spoke
        documentIndex: 1
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-kapture-spoke
        documentIndex: 1
