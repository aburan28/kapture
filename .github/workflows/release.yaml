name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kapture

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [hub, spoke, agent, replay]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          # Dockerfile.replay builds the replay-engine worker image.
          name="${{ matrix.component }}"
          if [ "$name" = "replay" ]; then name="replay-engine"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Package chart with release version and image tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Point chart defaults at the released images.
          for c in hub spoke agent; do
            yq -i ".${c}.image.repository = \"${IMAGE_PREFIX}-${c}\" | .${c}.image.tag = \"${VERSION}\"" \
              charts/kapture/values.yaml
          done
          yq -i ".replayEngine.image.repository = \"${IMAGE_PREFIX}-replay-engine\" | .replayEngine.image.tag = \"${VERSION}\"" \
            charts/kapture/values.yaml
          helm package charts/kapture --version "${VERSION}" --app-version "${VERSION}"

      - name: Push chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push "kapture-${VERSION}.tgz" "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: kapture-*.tgz

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [images, chart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          {
            echo "## Images"
            for c in hub spoke agent replay-engine; do
              echo "- \`${IMAGE_PREFIX}-${c}:${VERSION#v}\`"
            done
            echo
            echo "## Helm chart"
            echo '```'
            echo "helm install kapture oci://${REGISTRY}/${{ github.repository_owner }}/charts/kapture --version ${VERSION#v}"
            echo '```'
            echo
            echo "## Changes"
            if [ -n "$PREV" ]; then
              git log --pretty='- %s' "${PREV}..${VERSION}"
            else
              git log --pretty='- %s' "${VERSION}"
            fi
          } > notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: kapture-*.tgz
