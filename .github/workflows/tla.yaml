name: TLA+ Model Checking

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: .cache/tla
          key: tla2tools-1.8.0

      - name: Model-check TLA+ specs
        run: ./hack/verify-tla.sh
